<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Media Center</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400&display=swap" media="print" onload="this.media='all'">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  @property --pos { syntax: "<number>"; inherits: true; initial-value: 0; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Frutiger", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 300; overflow: hidden; color: #fff; -webkit-font-smoothing: antialiased;
    background: #0a1828;
  }
  #root { height: 100vh; width: 100vw; }

  .stage {
    position: relative; height: 100%; width: 100%; overflow: hidden;
    background: #1a1814 url("back-1.png") center / cover no-repeat;
  }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 120% at 50% 46%, rgba(8,10,14,0.18) 0%, rgba(8,10,14,0.42) 62%, rgba(5,7,11,0.66) 100%);
  }
  .stage::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 40%; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 70%);
  }

  /* brand */
  .brand {
    position: absolute; top: clamp(20px, 3.4vh, 34px); right: clamp(26px, 3vw, 46px);
    display: flex; align-items: center; gap: 11px; z-index: 9; opacity: 0.92;
  }
  .brand .wordmark { font-size: clamp(15px, 1.35vw, 19px); letter-spacing: 0.16em; font-weight: 400; }
  .brand .wordmark b { font-weight: 600; }
  .brand .orb {
    width: clamp(22px, 1.9vw, 27px); height: clamp(22px, 1.9vw, 27px); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #eaf4ff, #8fc4ff 38%, #2f7fe0 70%, #15498f 100%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.4), 0 0 14px rgba(120,190,255,0.55);
  }

  /* ===== horizontal category rail ===== */
  .rail-wrap {
    position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
    z-index: 4; overflow: visible; pointer-events: none;
  }
  .rail {
    position: absolute; left: 0; top: 0; display: flex; align-items: center;
    pointer-events: auto;
    transition: transform 0.55s cubic-bezier(0.22, 0.61, 0.27, 1);
  }
  .slot {
    position: relative; flex: none;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.5s cubic-bezier(0.22,0.61,0.27,1), opacity 0.5s ease, filter 0.5s ease;
  }
  .slot.side { cursor: pointer; }

  /* big preview tile (collapsed category) */
  .preview {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    border-radius: 9px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 18px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.25);
    transition: opacity 0.5s ease;
  }
  .slot.focused .preview { opacity: 0; pointer-events: none; }

  .mosaic-wrap { position: absolute; inset: 0; }
  .mosaic-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile-glow { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent 26%); }
  .tile-scrim { position: absolute; left:0; right:0; bottom:0; height: 52%; pointer-events:none;
    background: linear-gradient(180deg, transparent, rgba(5,14,28,0.72) 78%); }

  /* category name */
  .cat-name {
    position: absolute; left: 50%; top: 50%; z-index: 80;
    transform: translate(-50%, -50%);
    text-align: center; white-space: nowrap; pointer-events: none;
    font-weight: 300; color: #fff; letter-spacing: 0.005em;
    text-shadow: 0 2px 16px rgba(0,0,0,0.85), 0 1px 3px rgba(0,0,0,0.75);
    transition: font-size 0.4s ease;
  }
  .cat-name.under {
    padding: 7px 26px; border-radius: 40px;
    background: rgba(8,18,32,0.5);
    box-shadow: 0 6px 22px rgba(0,0,0,0.4);
  }

  /* ===== carousel (expanded) — circular 3D wheel driven by --pos ===== */
  .carousel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    perspective: 1150px; transform-style: preserve-3d; pointer-events: auto;
    transition: --pos 0.5s cubic-bezier(0.25, 0.7, 0.25, 1);
  }
  .citem {
    --ang: calc(mod((calc(var(--i) - var(--pos)) * var(--step)) + 3.14159265rad, 6.28318531rad) - 3.14159265rad);
    --c: cos(var(--ang));
    --raw: mod(calc(var(--i) - round(var(--pos))), var(--M));
    z-index: calc(round(60 - min(var(--raw), calc(var(--M) - var(--raw))) * 5));
    height: var(--citem-h);
    position: absolute; left: 50%; top: 50%;
    border-radius: 8px; overflow: hidden; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.26);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    transition: height 0.45s cubic-bezier(0.25,0.7,0.25,1), filter 0.35s ease;
    transform:
      translate(-50%, -50%)
      translateY(calc(var(--R) * sin(var(--ang))))
      translateZ(calc(var(--R) * (var(--c) - 1)))
      scale(calc(0.79 + 0.21 * ((var(--c) + 1) / 2)));
    opacity: clamp(0.16, calc(0.22 + 0.42 * (var(--c) + 1)), 1);
    filter: brightness(0.4);
    will-change: transform, opacity;
  }
  .citem.center {
    height: var(--citem-ch);
    border-color: rgba(255,255,255,0.82);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 16px 42px rgba(0,0,0,0.58), 0 0 32px rgba(130,190,255,0.5);
    filter: brightness(1);
  }
  .citem .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 10px 7px;
    background: linear-gradient(180deg, transparent, rgba(5,14,28,0.6) 36%, rgba(5,14,28,0.94) 100%);
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.85); line-height: 1.1;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .citem.center .cap { opacity: 1; }

  /* nav arrows (touch-friendly) */
  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    z-index: 10; width: 44px; height: 44px; border-radius: 50%;
    background: rgba(10,24,40,0.55); border: 1px solid rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: rgba(255,255,255,0.75);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 0.2s, border-color 0.2s;
    user-select: none; pointer-events: auto;
  }
  .nav-arrow:hover { background: rgba(30,60,90,0.7); border-color: rgba(255,255,255,0.35); }
  .nav-arrow.nav-prev { left: 12px; }
  .nav-arrow.nav-next { right: 12px; }
  .nav-arrow svg { width: 20px; height: 20px; }

  /* vertical sub-carousel pager — sits over the center card's corners */
  .csub-arrow {
    position: absolute; z-index: 100;
    border-radius: 50%;
    background: rgba(10,24,40,0.55); border: 1px solid rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: rgba(255,255,255,0.8);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 0.2s, border-color 0.2s, opacity 0.2s;
    user-select: none; pointer-events: auto;
  }
  .csub-arrow:hover { background: rgba(30,60,90,0.75); border-color: rgba(255,255,255,0.4); }
  .csub-arrow svg { width: 55%; height: 55%; }

  /* autoplay strips */
  .auto-strips {
    position: absolute; left: 50%; bottom: clamp(46px, 6vh, 60px); transform: translateX(-50%);
    z-index: 9; display: flex; align-items: center; gap: 8px;
  }
  .auto-strip {
    width: 48px; height: 3px; border-radius: 99px;
    background: rgba(255,255,255,0.22); overflow: hidden; cursor: pointer;
    transition: filter .35s ease;
  }
  .auto-strip.active { filter: drop-shadow(0 0 5px rgba(255,255,255,.5)); }
  .auto-strip-fill {
    height: 100%; width: 0%; background: #fff; border-radius: 99px;
    animation: strip-progress 4s linear forwards;
  }
  @keyframes strip-progress { from { width: 0%; } to { width: 100%; } }

  /* title slot */
  .title-card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    display: flex; flex-direction: column; justify-content: center;
    font-family: 'Manrope', sans-serif;
  }
  .tc-inner { padding: 0 6%; transition: opacity 0.55s ease; }
  .tc-eyebrow { font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(255,255,255,0.45); font-weight: 400; margin-bottom: 22px; }
  .tc-h { font-weight: 400; font-size: clamp(28px, 2.8vw, 44px); line-height: 1.06; letter-spacing: 0.01em; text-transform: uppercase; color: #fff; margin-bottom: 22px; }
  .tc-desc { font-size: 16px; line-height: 1.55; color: rgba(255,255,255,0.5); font-weight: 300; }

  /* hint */
  .hint {
    position: absolute; left: 50%; bottom: clamp(15px, 2.4vh, 24px); transform: translateX(-50%);
    z-index: 9; display: flex; align-items: center; gap: 9px;
    font-size: 13px; letter-spacing: 0.03em; color: rgba(210,228,250,0.5);
  }
  .hint kbd {
    font-family: inherit; font-size: 12px; min-width: 22px; height: 22px; padding: 0 6px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.28); border-radius: 5px;
    background: rgba(255,255,255,0.06); color: rgba(232,242,255,0.8);
  }
  .hint .sep { opacity: 0.4; margin: 0 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useRef, useCallback, useLayoutEffect } = React;
const h = React.createElement;

/* ---------- seeded mosaic generator ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeMosaic(seed, hr, sr, lr){
  const r = mulberry32(seed); const out = [];
  for(let i=0;i<28;i++){
    out.push(`hsl(${(hr[0]+r()*(hr[1]-hr[0]))|0} ${(sr[0]+r()*(sr[1]-sr[0]))|0}% ${(lr[0]+r()*(lr[1]-lr[0]))|0}%)`);
  }
  return out;
}

/* ---------- data ---------- */
const CATS = [
  { id:"title", label:"Виды работ", isTitle:true, subs:[] },
  { id:"shower", label:"Душевые", subs:[
      "Тёмно-серое стекло · золото", "Бронзовое стекло · хром", "Матовое стекло · хром",
      "Серое стекло · чёрная фурнитура", "Зелёное стекло · хром", "Рифлёное стекло · бронза",
      "Тёмно-серое стекло · хром", "Стекло-интим · хром",
    ], photos: [
    "assets/examples/shower_room/1_dark_grey_gold.webp",
    "assets/examples/shower_room/2_bronze_chrome.webp",
    "assets/examples/shower_room/3_matte_clear_chrome.webp",
    "assets/examples/shower_room/4_grey_black.webp",
    "assets/examples/shower_room/5_green_clear_chrome.webp",
    "assets/examples/shower_room/6_ribbed_bronze.webp",
    "assets/examples/shower_room/7_dark_grey_chrome.webp",
    "assets/examples/shower_room/8_privacy_chrome.webp",
  ] },
  { id:"mirrors_light", label:"Зеркала с подсветкой", subs:["Квадратное"], photos: [
    "assets/examples/mirrors_light/1_square.webp",
  ] },
  { id:"spotlight", label:"Spotlight", subs:["обзор", "что нового", "избранное"] },
  { id:"movies", label:"Movies", subs:["ещё фильмы", "библиотека фильмов", "play dvd", "поиск"] },
  { id:"music", label:"Music", subs:["ещё музыка", "музыкальная библиотека", "play all", "радио", "поиск"] },
  { id:"tv", label:"TV", subs:["прямой эфир", "записанное", "телегид", "настройка"] },
  { id:"photos", label:"Photos + Video", subs:["видео", "библиотека фото", "избранное", "слайд-шоу"] },
  { id:"programs", label:"Programs", subs:["ещё приложения", "библиотека", "поиск"] },
  { id:"tasks", label:"Tasks", subs:["синхронизация", "настройки", "выключение"] },
];
const DEFAULT_CAT = 0;
const N = CATS.length;
// Rendered as several repeated copies of CATS so the rail always has real
// slots to slide into in either direction; `ai` (the absolute index into
// this array) periodically gets recentered back into the middle copy once
// scrolling settles (see resetRef below), so it never has to grow without
// bound. COPIES=5 gives a wide buffer (2*N steps either way) so even a fast
// continuous scroll burst can't outrun the recenter and run off the rendered
// array — which is what made the carousel appear to "disappear".
const COPIES = 5;
const MID = Math.floor(COPIES / 2);
const RAIL_CATS = Array.from({ length: COPIES }, () => CATS).flat();
const DEFAULT_AI = MID * N + DEFAULT_CAT;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function ringOffset(i, pos, n){ let d = ((i - pos) % n + n) % n; if(d > n/2) d -= n; return d; }
const wrap = (v, n) => ((v % n) + n) % n;
function ringSize(n){ let M = n; while(M < 10) M += n; return M; }

/* geometry */
const PREV_W = 470, PREV_H = 602;
const TILE_W = 360, TILE_H = 360, CENTER_H = 540;
const RADIUS = 326;
const GAP = 90;

const PHOTOS = Array.from({ length: 42 }, (_, i) => `https://picsum.photos/seed/${i + 20}/470/600`);
function catPhoto(ci, subIdx){
  const cat = CATS[ci];
  if (cat.photos && cat.photos.length) return cat.photos[subIdx % cat.photos.length];
  return PHOTOS[(ci * 7 + subIdx) % PHOTOS.length];
}

const Mosaic = React.memo(function Mosaic({ src }){
  return h("div", { className: "mosaic-wrap" },
    h("img", { src: src, alt: "", draggable: "false", loading: "lazy" })
  );
});

const CItem = React.memo(function CItem({ c, isC, tw, capSize, sub, src, onPick }){
  return h("div", {
    className: "citem" + (isC ? " center" : ""),
    onClick: () => onPick(c),
    style: { width: tw, "--i": c }
  },
    h(Mosaic, { src: src }),
    h("div", { className: "tile-glow" }),
    h("div", { className: "cap", style: { fontSize: capSize } }, sub)
  );
});

function Carousel({ ci, posAccum, u, onPick, onStepSub }){
  const subs = CATS[ci].subs, n = subs.length;
  const M = ringSize(n);
  const step = (2 * Math.PI) / M;
  const center = wrap(Math.round(posAccum), M);
  const tw = TILE_W * u, R = RADIUS * u;
  const capSize = 17.5 * u;
  const btnSize = 46 * u, inset = 8 * u;
  const halfW = tw / 2, halfH = (CENTER_H * u) / 2;
  return h("div", {
    className: "carousel",
    style: {
      width: tw, height: TILE_H * u,
      "--pos": posAccum, "--R": R + "px", "--step": step + "rad",
      "--M": M,
      "--citem-h": (TILE_H * u) + "px",
      "--citem-ch": (CENTER_H * u) + "px",
    }
  },
    ...Array.from({ length: M }, (_, c) =>
      h(CItem, {
        key: c,
        c: c, isC: c === center, tw: tw, capSize: capSize,
        sub: subs[c % n],
        src: catPhoto(ci, c % n),
        onPick: onPick
      })
    ),
    n > 1 && h("div", {
      className: "csub-arrow csub-up",
      style: {
        width: btnSize, height: btnSize,
        left: "50%", top: "50%",
        transform: "translate(calc(-50% + " + (halfW - inset) + "px), calc(-50% - " + (halfH - inset) + "px))",
      },
      onClick: (e) => { e.stopPropagation(); onStepSub(-1); },
      "aria-label": "Предыдущий пункт",
    },
      h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        h("polyline", { points: "6 15 12 9 18 15" })
      )
    ),
    n > 1 && h("div", {
      className: "csub-arrow csub-down",
      style: {
        width: btnSize, height: btnSize,
        left: "50%", top: "50%",
        transform: "translate(calc(-50% + " + (halfW - inset) + "px), calc(-50% + " + (halfH - inset) + "px))",
      },
      onClick: (e) => { e.stopPropagation(); onStepSub(1); },
      "aria-label": "Следующий пункт",
    },
      h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        h("polyline", { points: "6 9 12 15 18 9" })
      )
    )
  );
}

function App(){
  const [ai, setAi] = useState(DEFAULT_AI);
  const realAi = ai % N;
  const [selMap, setSelMap] = useState(() => {
    const o = {}; CATS.forEach((c, i) => { o[i] = c.subs.length > 1 ? 1 : 0; }); return o;
  });
  const [posAccum, setPosAccum] = useState(selMap[DEFAULT_CAT]);
  const [dim, setDim] = useState({ w: window.innerWidth, h: window.innerHeight });
  const u = clamp(Math.min(dim.w / 1920, dim.h / 1080), 0.55, 1.15);

  const railRef = useRef(null);
  const [shift, setShift] = useState(() => {
    const u0 = clamp(Math.min(window.innerWidth / 1920, window.innerHeight / 1080), 0.55, 1.15);
    const sw = PREV_W * u0;
    return Math.round(window.innerWidth / 2 - sw / 2 - DEFAULT_AI * (sw + GAP * u0));
  });
  const [instant, setInstant] = useState(false);

  const [spread, setSpread] = useState(false);
  const [spreadDone, setSpreadDone] = useState(false);
  const spreadRef = useRef(false);

  useEffect(() => {
    if (!spread) return;
    const t = setTimeout(() => setSpreadDone(true), 900);
    return () => clearTimeout(t);
  }, [spread]);

  const posRef = useRef(posAccum); posRef.current = posAccum;
  const aiRef = useRef(ai); aiRef.current = ai;
  const selMapRef = useRef(selMap); selMapRef.current = selMap;
  const visibilityRef = useRef(0);
  const [visible, setVisible] = useState(false);

  const [autoEnabled, setAutoEnabled] = useState(true);
  const [animKey, setAnimKey] = useState(0);
  const idleRef = useRef(null);

  const onUserInteract = useCallback(() => {
    setAutoEnabled(false);
    clearTimeout(idleRef.current);
    idleRef.current = setTimeout(() => {
      setAutoEnabled(true);
      setAnimKey(k => k + 1);
    }, 3000);
  }, []);

  const onStripEnd = useCallback(() => {
    setAi(v => v + 1);
    setAnimKey(k => k + 1);
  }, []);

  useEffect(() => {
    const sw = PREV_W * u, gapPx = GAP * u;
    setShift(Math.round(dim.w / 2 - sw / 2 - ai * (sw + gapPx)));
  }, [ai, dim, u]);

  // Recenters `ai` back into the middle copy once the slide transition has
  // settled. Deliberately scheduled only once per "burst" (not reset on
  // every step) — resetting on each step meant fast continuous scrolling
  // (steps less than 570ms apart) postponed this forever, letting `ai` drift
  // past the rendered RAIL_CATS array entirely. The recenter target is also
  // computed with a full modulo wrap so it self-corrects regardless of how
  // far `ai` drifted before this got to run, not just by a single ±N shift.
  const resetRef = useRef(null);
  useEffect(() => {
    if (resetRef.current) return;
    resetRef.current = setTimeout(() => {
      resetRef.current = null;
      const cur = aiRef.current;
      if (cur < MID * N || cur >= (MID + 1) * N) {
        setInstant(true);
        setAi(MID * N + wrap(cur, N));
      }
    }, 570);
  }, [ai]);
  useEffect(() => () => clearTimeout(resetRef.current), []);

  useEffect(() => {
    if (!instant) return;
    const raf = requestAnimationFrame(() => requestAnimationFrame(() => setInstant(false)));
    return () => cancelAnimationFrame(raf);
  }, [instant]);

  useLayoutEffect(() => {
    const v = selMapRef.current[ai % N];
    posRef.current = v; setPosAccum(v);
  }, [ai]);

  useEffect(() => {
    const onResize = () => setDim({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const stepCat = useCallback((dir) => setAi(v => v + dir), []);

  const stepSub = useCallback((dir) => {
    const a = aiRef.current % N, n = CATS[a].subs.length;
    if (!n) return;
    const np = posRef.current + dir;
    posRef.current = np; setPosAccum(np);
    setSelMap(m => ({ ...m, [a]: wrap(np, n) }));
  }, []);

  const stepSubUI = useCallback((dir) => { stepSub(dir); onUserInteract(); }, [stepSub, onUserInteract]);

  const pickSub = useCallback((cell) => {
    const a = aiRef.current % N, n = CATS[a].subs.length;
    if (!n) return;
    const M = ringSize(n);
    const off = ringOffset(cell, wrap(posRef.current, M), M);
    const np = posRef.current + off;
    posRef.current = np; setPosAccum(np);
    setSelMap(m => ({ ...m, [a]: cell % n }));
    onUserInteract();
  }, [onUserInteract]);

  const extAccum = useRef(0), extCool = useRef(0);

  useEffect(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === 'visibility') {
        const nowVisible = e.data.ratio >= 0.8;
        const wasVisible = visibilityRef.current >= 0.8;
        visibilityRef.current = e.data.ratio;
        setVisible(nowVisible);
        if (nowVisible && !wasVisible) {
          setAnimKey(k => k + 1);
          if (!spreadRef.current) {
            spreadRef.current = true;
            setTimeout(() => setSpread(true), 100);
          }
        }
        return;
      }
      if (e.data.type === 'swipeX') { stepCat(e.data.dir); onUserInteract(); return; }
      if (e.data.type === 'wheelX') {
        const now = performance.now();
        if (now < extCool.current) return;
        extAccum.current += e.data.delta;
        if (extAccum.current > 80)       { stepCat(1);  extAccum.current = 0; extCool.current = now + 220; onUserInteract(); }
        else if (extAccum.current < -80) { stepCat(-1); extAccum.current = 0; extCool.current = now + 220; onUserInteract(); }
      }
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [stepCat, onUserInteract]);

  useEffect(() => {
    const onKey = (e) => {
      if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
      if(e.key === "ArrowLeft")       { stepCat(-1); onUserInteract(); }
      else if(e.key === "ArrowRight") { stepCat(1);  onUserInteract(); }
      else if(e.key === "ArrowUp")    { stepSub(-1); onUserInteract(); }
      else if(e.key === "ArrowDown")  { stepSub(1);  onUserInteract(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [stepCat, stepSub, onUserInteract]);

  const accum = useRef(0), cool = useRef(0), lastT = useRef("cat");
  useEffect(() => {
    const onWheel = (e) => {
      const horizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      const inSubs = Math.abs(e.clientX - cx) < 0.5 * PREV_W * u + 40 &&
                     Math.abs(e.clientY - cy) < 0.5 * PREV_H * u + 60;
      const hasSubs = CATS[aiRef.current % N].subs.length > 0;
      if (!horizontal && (!inSubs || !hasSubs)) return;
      e.preventDefault();
      const delta = horizontal ? e.deltaX : e.deltaY;
      if(lastT.current !== (horizontal ? "cat" : "sub")){ accum.current = 0; lastT.current = horizontal ? "cat" : "sub"; }
      accum.current += delta;
      const now = performance.now();
      if(now < cool.current) return;
      const TH = horizontal ? 80 : 45;
      const step = horizontal ? stepCat : stepSub;
      if(accum.current > TH){       step(1);  accum.current = 0; cool.current = now + 220; onUserInteract(); }
      else if(accum.current < -TH){ step(-1); accum.current = 0; cool.current = now + 220; onUserInteract(); }
    };
    window.addEventListener("wheel", onWheel, { passive: false });
    return () => window.removeEventListener("wheel", onWheel);
  }, [stepCat, stepSub, u, onUserInteract]);

  useEffect(() => {
    let sx = 0, sy = 0;
    const onStart = (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
    const onEnd = (e) => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > Math.abs(dy) * 1.1 && Math.abs(dx) > 30) {
        dx < 0 ? stepCat(1) : stepCat(-1);
        onUserInteract();
      } else if (Math.abs(dy) > Math.abs(dx) * 1.1 && Math.abs(dy) > 30) {
        const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        const inSubs = Math.abs(sx - cx) < 0.5 * PREV_W * u + 40 &&
                       Math.abs(sy - cy) < 0.5 * PREV_H * u + 60;
        const hasSubs = CATS[aiRef.current % N].subs.length > 0;
        if (inSubs && hasSubs) { dy < 0 ? stepSub(1) : stepSub(-1); onUserInteract(); }
      }
    };
    window.addEventListener("touchstart", onStart, { passive: true });
    window.addEventListener("touchend", onEnd, { passive: true });
    return () => {
      window.removeEventListener("touchstart", onStart);
      window.removeEventListener("touchend", onEnd);
    };
  }, [stepCat, stepSub, u, onUserInteract]);

  const slotW = PREV_W * u, slotH = PREV_H * u;

  return h("div", { className: "stage" },
    h("button", {
      className: "nav-arrow nav-prev", "aria-label": "Предыдущая категория",
      onClick: () => { stepCat(-1); onUserInteract(); }
    },
      h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        h("polyline", { points: "15 18 9 12 15 6" })
      )
    ),
    h("button", {
      className: "nav-arrow nav-next", "aria-label": "Следующая категория",
      onClick: () => { stepCat(1); onUserInteract(); }
    },
      h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
        h("polyline", { points: "9 18 15 12 9 6" })
      )
    ),
    h("div", { className: "rail-wrap", style: { height: slotH } },
      h("div", {
        className: "rail", ref: railRef,
        style: Object.assign(
          { transform: "translateX(" + shift + "px)", gap: GAP * u },
          instant ? { transition: "none" } : {}
        )
      },
        ...RAIL_CATS.map(function(c, tripleI) {
          const realI = tripleI % N;
          const focused = tripleI === ai;
          const coverPhoto = c.isTitle ? null : catPhoto(realI, selMap[realI] || 0);
          const dist = Math.abs(tripleI - DEFAULT_AI);

          let slotTransform, slotOpacity, slotDelay;
          if (!spread) {
            const dxToTitle = (DEFAULT_AI - tripleI) * (slotW + GAP * u);
            if (c.isTitle) {
              slotTransform = "scale(1)";
              slotOpacity = 1;
            } else if (dist <= 3) {
              const peek = dist * 5;
              slotTransform = "translateX(" + (dxToTitle + peek) + "px) scale(" + (1 - dist * 0.012) + ")";
              slotOpacity = [0, 0.52, 0.26, 0.1][dist];
            } else {
              slotTransform = "translateX(" + dxToTitle + "px) scale(0.74)";
              slotOpacity = 0;
            }
            slotDelay = "0ms";
          } else {
            slotTransform = "scale(" + (focused ? 1 : 0.74) + ")";
            slotOpacity = focused ? 1 : 0.82;
            slotDelay = spreadDone ? "0ms" : (Math.min(dist, 6) * 38) + "ms";
          }

          return h("div", {
            key: tripleI,
            className: "slot" + (focused ? " focused" : " side"),
            onClick: () => { if(!focused){ setAi(tripleI); onUserInteract(); } },
            style: {
              width: slotW, height: slotH,
              transform: slotTransform,
              opacity: slotOpacity,
              filter: focused ? "none" : "saturate(0.85) brightness(0.9)",
              transitionDelay: slotDelay,
            }
          },
            c.isTitle
              ? h("div", { className: "title-card", style: { width: slotW, height: slotH } },
                  h("div", { className: "tc-inner", style: { opacity: spread ? 1 : 0, transitionDelay: spread ? "180ms" : "0ms" } },
                    h("div", { className: "tc-eyebrow" }, "/ Проекты"),
                    h("h2", { className: "tc-h" }, "Виды", h("br", null), "работ"),
                    h("p", { className: "tc-desc" },
                      "Реализованные проекты: зеркала, душевые перегородки, стеклянные полки и ограждения для дома и бизнеса."
                    )
                  )
                )
              : h(React.Fragment, null,
                  h("div", { className: "preview", style: { width: slotW, height: slotH } },
                    h(Mosaic, { src: coverPhoto }),
                    h("div", { className: "tile-glow" }),
                    h("div", { className: "tile-scrim" })
                  ),
                  focused ? h(Carousel, { key: "car-" + c.id + "-" + tripleI, ci: realI, posAccum: posAccum, u: u, onPick: pickSub, onStepSub: stepSubUI }) : null,
                  h("div", {
                    className: "cat-name" + (focused ? " under" : ""),
                    style: {
                      transform: "translate(-50%, " + ((focused ? (CENTER_H / 2 + 34) : 0) * u) + "px)",
                      fontSize: (focused ? 35 : 33) * u
                    }
                  }, c.label)
                )
          );
        })
      )
    ),
    h("div", { className: "auto-strips" },
      ...CATS.map(function(_, ci) {
        return h("div", {
          key: ci,
          className: "auto-strip" + (ci === realAi ? " active" : ""),
          onClick: () => { setAi(MID * N + ci); onUserInteract(); }
        },
          ci === realAi && autoEnabled && visible
            ? h("div", { key: animKey, className: "auto-strip-fill", onAnimationEnd: onStripEnd })
            : null
        );
      })
    ),
    h("div", { className: "hint" },
      h("kbd", null, "←"),
      h("kbd", null, "→"),
      h("span", null, "категории"),
      h("span", { className: "sep" }, "•"),
      h("kbd", null, "↑"),
      h("kbd", null, "↓"),
      h("span", null, "подкатегории"),
      h("span", { className: "sep" }, "•"),
      h("span", null, "или колёсико мыши")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
</script>
</body>
</html>
