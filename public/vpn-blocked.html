<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VIPGLASS — Отключите VPN</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:#0a0f1a;
    background-image:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(40,80,140,0.22),transparent);
    color:#fff;
  }
  .card{
    text-align:center;padding:52px 40px;max-width:460px;width:90%;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    backdrop-filter:blur(12px);
  }
  .icon{
    width:64px;height:64px;margin:0 auto 28px;
    background:radial-gradient(circle at 35% 30%,#eaf4ff,#8fc4ff 38%,#2f7fe0 70%,#15498f 100%);
    border-radius:50%;
    box-shadow:0 0 0 1px rgba(255,255,255,0.3),0 0 28px rgba(100,180,255,0.4);
  }
  .brand{font-size:13px;letter-spacing:0.22em;color:rgba(255,255,255,0.4);margin-bottom:28px;text-transform:uppercase}
  h1{font-size:26px;font-weight:400;letter-spacing:0.01em;margin-bottom:14px;line-height:1.2}
  h1 b{font-weight:600}
  p{font-size:15px;line-height:1.6;color:rgba(255,255,255,0.5);margin-bottom:32px}
  .step{
    display:flex;align-items:flex-start;gap:14px;
    text-align:left;margin-bottom:14px;
    background:rgba(255,255,255,0.04);
    border-radius:12px;padding:14px 16px;
  }
  .step-num{
    flex:none;width:26px;height:26px;border-radius:50%;
    background:rgba(60,130,220,0.25);border:1px solid rgba(100,170,255,0.3);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:rgba(160,200,255,0.9);font-weight:600;
  }
  .step-text{font-size:14px;line-height:1.5;color:rgba(255,255,255,0.7);padding-top:2px}
  .btn{
    display:inline-block;margin-top:8px;padding:14px 32px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    border-radius:10px;color:#fff;font-size:15px;font-weight:500;
    text-decoration:none;letter-spacing:0.01em;
    transition:opacity 0.2s;cursor:pointer;border:none;
  }
  .btn:hover{opacity:0.85}
</style>
</head>
<body>
<div class="card">
  <div class="icon"></div>
  <div class="brand">VIPGLASS</div>
  <h1>Отключите <b>VPN</b><br>для доступа к сайту</h1>
  <p>Наш сайт размещён на российском сервере и недоступен через VPN. Это займёт 10 секунд.</p>
  <div class="step">
    <div class="step-num">1</div>
    <div class="step-text">Откройте приложение VPN на вашем устройстве</div>
  </div>
  <div class="step">
    <div class="step-num">2</div>
    <div class="step-text">Отключите VPN или выберите российский сервер</div>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-text">Обновите страницу</div>
  </div>
  <button class="btn" onclick="window.location.reload()">Обновить страницу</button>
</div>
</body>
</html>
