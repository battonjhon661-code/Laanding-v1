name: Deploy to SprintHost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create .htaccess for Apache
        run: |
          printf 'Options -MultiViews\nRewriteEngine On\nRewriteBase /\n\nRewriteCond %%{REQUEST_FILENAME} -f [OR]\nRewriteCond %%{REQUEST_FILENAME} -d\nRewriteRule ^ - [L]\n\nRewriteRule ^ /index.html [L]\n' > out/.htaccess

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode off;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
            mirror --reverse --verbose --exclude '\.(png|jpg|jpeg|webp|webm|mp4|svg|ico)$' ./out/ /domains/laanding-v1.ru/public_html/;
          "
